[build]
  publish = "."
  functions = "netlify/functions"

# Fuerza siempre HTTPS y unifica el dominio en la versión sin "www"
# (así coincide con el canonical, el sitemap y el schema que usamos: https://simoncastrofotografo.com)
[[redirects]]
  from = "http://simoncastrofotografo.com/*"
  to = "https://simoncastrofotografo.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.simoncastrofotografo.com/*"
  to = "https://simoncastrofotografo.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.simoncastrofotografo.com/*"
  to = "https://simoncastrofotografo.com/:splat"
  status = 301
  force = true

# URLs viejas (.html) -> nuevas carpetas. Conservan el posicionamiento en Google.
[[redirects]]
  from = "/portafolio-completo.html"
  to = "/portafolio-completo/"
  status = 301

[[redirects]]
  from = "/dulce.html"
  to = "/dulce/"
  status = 301

[[redirects]]
  from = "/evelyn.html"
  to = "/evelyn/"
  status = 301

[[redirects]]
  from = "/isabella.html"
  to = "/isabella/"
  status = 301

[[redirects]]
  from = "/mariana.html"
  to = "/mariana/"
  status = 301

[[redirects]]
  from = "/cotizador.html"
  to = "/cotizador/"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Asegura que las rutas de carpetas abran siempre su index.html.
[[redirects]]
  from = "/portafolio-completo"
  to = "/portafolio-completo/"
  status = 301

[[redirects]]
  from = "/mariana"
  to = "/mariana/"
  status = 301

[[redirects]]
  from = "/evelyn"
  to = "/evelyn/"
  status = 301

[[redirects]]
  from = "/isabella"
  to = "/isabella/"
  status = 301

[[redirects]]
  from = "/dulce"
  to = "/dulce/"
  status = 301

# Encabezados de seguridad básicos (no rompen el Pixel de Meta, Cloudinary ni Google Fonts)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
